<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notion Flip Clock V9</title>

  <style>
    :root{
      --top:#252938;
      --bottom:#171922;
      --text:#f5f7ff;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: radial-gradient(circle at top,#0d1324 0%,#05070f 70%);
      font-family: Inter, system-ui, sans-serif;
      color:var(--text);
    }

    .clock{ text-align:center; }

    .row{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:14px;
      margin:14px 0;
    }

    .group{ display:flex; gap:10px; }

    .separator{
      font-size:42px;
      font-weight:700;
      opacity:.7;
      line-height:1;
    }

    .flip{
      position:relative;
      width:84px;
      height:102px;
      perspective:1000px;
      transform-style: preserve-3d;

      /* ✅ 추가: 이 플립의 "전체 높이"를 변수로 고정 */
      --h: 102px;
    }

    .small{
      width:58px;
      height:72px;

      /* ✅ 추가: small 플립의 전체 높이 */
      --h: 72px;
    }

    .top,.bottom,.flip-top,.flip-bottom{
      position:absolute;
      left:0;
      width:100%;
      height:50%;
      overflow:hidden;
      background: linear-gradient(180deg, var(--top) 0%, var(--bottom) 100%);
      border: 1px solid rgba(255,255,255,.05);
    }

    .top,.flip-top{
      top:0;
      border-radius:12px 12px 0 0;
    }

    .bottom,.flip-bottom{
      bottom:0;
      border-radius:0 0 12px 12px;
    }

    /* ===== ✅ 핵심: span을 "위에서 시작 + line-height=전체 높이"로 통일 ===== */
    .top span,
    .bottom span,
    .flip-top span,
    .flip-bottom span{
      position:absolute;
      left:50%;
      width:100%;
      text-align:center;
      font-weight:700;
      user-select:none;

      top:0;
      transform:translateX(-50%);
      line-height: var(--h);
    }

    /* 글자 크기만 분리 */
    .flip span{
      font-size:64px;
    }

    .small span{
      font-size:36px;
    }

    /* ✅ bottom은 전체 높이의 절반만큼 위로 올려서 아래 절반만 보이게 */
    .bottom span,
    .flip-bottom span{
      top: calc(var(--h) * -0.5);
    }

    .flip-top{
      z-index:5;
      transform-origin:bottom;
      backface-visibility:hidden;
    }

    .flip-bottom{
      z-index:4;
      transform-origin:top;
      transform:rotateX(90deg);
      backface-visibility:hidden;
    }

    .play .flip-top{
      animation: flipTop .42s cubic-bezier(.22,.61,.36,1) forwards;
    }

    .play .flip-bottom{
      animation: flipBottom .42s cubic-bezier(.22,.61,.36,1) .42s forwards;
    }

    @keyframes flipTop{
      0%{ transform:rotateX(0deg); }
      100%{ transform:rotateX(-90deg); }
    }

    @keyframes flipBottom{
      0%{ transform:rotateX(90deg); }
      100%{ transform:rotateX(0deg); }
    }

    .hinge{
      position:absolute;
      top:50%;
      left:0;
      width:100%;
      height:3px;
      transform:translateY(-50%);
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.9));
      z-index:20;
      pointer-events:none;
    }
  </style>
</head>

<body>
  <div class="clock">
    <div class="row">
      <div class="group" id="hours"></div>
      <div class="separator">:</div>
      <div class="group" id="minutes"></div>
      <div class="separator">:</div>
      <div class="group" id="seconds"></div>
    </div>

    <div class="row" id="date"></div>
    <div class="row" id="day"></div>
  </div>

  <script>
    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

    function createDigit(small=false){
      const d = document.createElement("div");
      d.className = `flip ${small ? "small" : ""}`.trim();
      d.innerHTML = `
        <div class="top"><span>0</span></div>
        <div class="bottom"><span>0</span></div>
        <div class="flip-top"><span>0</span></div>
        <div class="flip-bottom"><span>0</span></div>
        <div class="hinge"></div>
      `;
      return d;
    }

    function build(container, count, small=false){
      const arr = [];
      for(let i=0;i<count;i++){
        const d = createDigit(small);
        container.appendChild(d);
        arr.push(d);
      }
      return arr;
    }

    const hourDigits   = build(document.getElementById("hours"), 2);
    const minuteDigits = build(document.getElementById("minutes"), 2);
    const secondDigits = build(document.getElementById("seconds"), 2);
    const dateDigits   = build(document.getElementById("date"), 6, true);
    const dayDigits    = build(document.getElementById("day"), 3, true);

    function flip(el, newVal){
      const top = el.querySelector(".top span");
      const bottom = el.querySelector(".bottom span");
      const flipTop = el.querySelector(".flip-top span");
      const flipBottom = el.querySelector(".flip-bottom span");

      if(top.textContent === newVal) return;

      flipTop.textContent = top.textContent;
      flipBottom.textContent = newVal;

      el.classList.remove("play");
      void el.offsetWidth;
      el.classList.add("play");

      setTimeout(() => {
        top.textContent = newVal;
        bottom.textContent = newVal;
        el.classList.remove("play");
      }, 840);
    }

    function update(){
      const now = new Date(
        new Date().toLocaleString("en-US", { timeZone: timezone })
      );

      const hh = String(now.getHours()).padStart(2,"0");
      const mm = String(now.getMinutes()).padStart(2,"0");
      const ss = String(now.getSeconds()).padStart(2,"0");

      const yy = String(now.getFullYear()).slice(2);
      const mo = String(now.getMonth()+1).padStart(2,"0");
      const dd = String(now.getDate()).padStart(2,"0");

      const day = now
        .toLocaleDateString("en-US", { weekday:"short" })
        .toUpperCase();

      hourDigits.forEach((d,i) => flip(d, hh[i]));
      minuteDigits.forEach((d,i) => flip(d, mm[i]));
      secondDigits.forEach((d,i) => flip(d, ss[i]));

      const dateStr = yy + mo + dd;
      dateDigits.forEach((d,i) => flip(d, dateStr[i]));

      dayDigits.forEach((d,i) => flip(d, day[i] || " "));
    }

    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
