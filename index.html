<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Notion LCD Clock V12</title>
<style>
  /* DSEG 7-segment & 14-segment (Keshikan / OFL) */
  @font-face{
    font-family:'DSEG7';
    src:url('https://cdn.jsdelivr.net/gh/keshikan/DSEG@v0.46/fonts/DSEG7-Classic/DSEG7Classic-Bold.woff2') format('woff2');
    font-display:swap;
  }
  @font-face{
    font-family:'DSEG14';
    src:url('https://cdn.jsdelivr.net/gh/keshikan/DSEG@v0.46/fonts/DSEG14-Classic/DSEG14Classic-Bold.woff2') format('woff2');
    font-display:swap;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    display:flex; align-items:center; justify-content:center;
    background:transparent;
    font-family:'DSEG7','Courier New',monospace;
    color:#1d1e22;
    padding:24px;
  }

  .clock{
    --body:#f1ede4;
    --screen-a:#d4dac9;
    --screen-b:#c5ccba;
    --ink:#1d1e22;
    --ghost:rgba(29,30,34,0.08);

    width:660px; max-width:100%;
    padding:34px 26px;
    background:var(--body);
    border-radius:26px;
    box-shadow:
      0 16px 32px rgba(0,0,0,0.14),
      inset 0 1px 0 rgba(255,255,255,0.85),
      inset 0 -3px 6px rgba(0,0,0,0.08);
  }

  .screen{
    position:relative;
    padding:22px 28px 20px;
    background:linear-gradient(180deg,var(--screen-b) 0%,var(--screen-a) 25%,var(--screen-a) 75%,var(--screen-b) 100%);
    border-radius:6px;
    box-shadow:
      inset 0 3px 6px rgba(0,0,0,0.18),
      inset 0 -1px 2px rgba(255,255,255,0.4);
    overflow:hidden;
  }
  .screen::after{ /* 가로 스캔라인 */
    content:""; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,0.018) 0 1px,transparent 1px 3px);
  }

  .row{ display:flex; align-items:stretch; justify-content:flex-start; gap:10px; position:relative; }

  /* ───── 좌측 ───── */
  .left{ position:relative; display:flex; align-items:flex-end; gap:12px; padding-top:22px; }
  .ampm{
    position:absolute; top:0; left:2px;
    font-family:'DSEG14','Courier New',monospace;
    font-size:16px; letter-spacing:2px; color:var(--ink);
  }

  /* HH:MM (with ghost) */
  .hm-wrap{ position:relative; line-height:.85; }
  .hm, .hm-ghost{
    font-size:104px; letter-spacing:2px;
    font-family:'DSEG7','Courier New',monospace;
    font-weight:700;
  }
  .hm-ghost{
    position:absolute; inset:0;
    color:var(--ghost); pointer-events:none; user-select:none;
  }
  .hm{ position:relative; color:var(--ink); }

  /* SS (with ghost) */
  .sec-wrap{ position:relative; align-self:flex-start; margin-top:14px; line-height:1; }
  .sec, .sec-ghost{
    font-size:44px;
    font-family:'DSEG7','Courier New',monospace;
    font-weight:700;
  }
  .sec-ghost{
    position:absolute; inset:0;
    color:var(--ghost); pointer-events:none; user-select:none;
  }
  .sec{ position:relative; color:var(--ink); }

  /* ───── 우측 ───── */
  .right{
    display:flex; flex-direction:column; justify-content:space-between;
    align-items:flex-end; padding:22px 0 6px; gap:10px;
  }
  .date-line{
    display:flex; align-items:baseline; gap:12px;
    font-size:30px; color:var(--ink);
  }
  .wd{ font-family:'DSEG14','Courier New',monospace; font-size:22px; letter-spacing:2px; }
  .week{
    display:flex; align-items:baseline; gap:4px;
    font-size:22px; color:var(--ink);
  }
  .week .lbl{ font-family:'DSEG14','Courier New',monospace; letter-spacing:2px; }
</style>
</head>
<body>

<div class="clock">
  <div class="screen">
    <div class="row">

      <!-- LEFT -->
      <div class="left">
        <span class="ampm" id="ampm">--</span>

        <span class="hm-wrap">
          <span class="hm-ghost" aria-hidden="true">88:88</span>
          <span class="hm"><span id="hh">--</span>:<span id="mm">--</span></span>
        </span>

        <span class="sec-wrap">
          <span class="sec-ghost" aria-hidden="true">88</span>
          <span class="sec" id="ss">--</span>
        </span>
      </div>

      <!-- RIGHT -->
      <div class="right">
        <div class="date-line">
          <span><span id="mo">--</span>/<span id="dd">--</span></span>
          <span class="wd" id="wd">---</span>
        </div>
        <div class="week">
          <span class="lbl">W</span><span id="wk">--</span>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
(function(){
  const KST = "Asia/Seoul";

  // ISO 8601 주차 (월요일 시작, 1/4 포함 주 = W01)
  function getISOWeek(y, m, d){
    const t = new Date(Date.UTC(y, m - 1, d));
    const dayNum = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - yearStart) / 86400000 + 1) / 7);
  }

  const $ = id => document.getElementById(id);
  const set = (id, v) => { const el = $(id); if (el && el.textContent !== v) el.textContent = v; };

  function tick(){
    try{
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: KST, hour12: false,
        year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", second: "2-digit",
        weekday: "short"
      }).formatToParts(new Date());
      const get = k => (parts.find(p => p.type === k) || {}).value || "";

      let hh = get("hour"); if (hh === "24") hh = "00";
      const mi = get("minute"), ss = get("second");
      const mo = get("month"), dd = get("day"), yy = get("year");
      const wd = (get("weekday") || "").toUpperCase();

      const h24 = parseInt(hh, 10);
      set("ampm", h24 < 12 ? "AM" : "PM");
      let h12 = h24 % 12; if (h12 === 0) h12 = 12;
      set("hh", String(h12).padStart(2, "0"));
      set("mm", mi);
      set("ss", ss);
      set("mo", mo);
      set("dd", dd);
      set("wd", wd);

      const wk = getISOWeek(parseInt(yy,10), parseInt(mo,10), parseInt(dd,10));
      set("wk", String(wk).padStart(2, "0"));
    }catch(e){
      console.error("[clock tick] error:", e);
    }
  }

  function start(){
    tick();
    // 다음 정각 초까지 기다렸다가 1초마다 갱신 (드리프트 방지)
    const ms = 1000 - (Date.now() % 1000);
    setTimeout(function loop(){
      tick();
      setTimeout(loop, 1000);
    }, ms);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();
</script>
</body>
</html>
